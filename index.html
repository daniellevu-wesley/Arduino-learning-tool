<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,sans-serif;background:#0d0f18;color:#e8e9ed;overflow:hidden}
:root{--a:#f5a623;--ok:#22c55e;--pos:#ef4444;--neg:#3b82f6;--s1:#161927;--s2:#1e2235;--bd:#2a2f45;--mu:#6b7280;--pur:#7c3aed;--amber:#f5a623;--cyan:#0accc5}
.shell{display:grid;grid-template-rows:46px 1fr;grid-template-columns:clamp(220px,28vw,300px) minmax(0,1fr);height:100vh;width:100vw}
/* TOPBAR */
.topbar{grid-column:1/-1;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.logo{font-size:11px;font-weight:700;color:var(--a);letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
.mod-tabs{display:flex;gap:3px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:3px;flex-shrink:0}
.mod-tab{padding:4px 10px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;color:var(--mu);transition:.15s;white-space:nowrap;user-select:none}
.mod-tab.a1{background:var(--a);color:#000}
.mod-tab.a2{background:var(--pur);color:#fff}
.nav-arrows{display:flex;gap:4px;margin-left:8px}
.nav-btn{width:28px;height:28px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;user-select:none;transition:.15s}
.nav-btn:hover:not([disabled]){border-color:var(--a);color:var(--a)}
.nav-btn[disabled]{opacity:.3;cursor:default;pointer-events:none}
.stepper{display:flex;align-items:center;gap:3px;margin-left:auto}
.sd{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--mu);cursor:pointer;transition:.2s;flex-shrink:0}
.sd.active{background:var(--a);border-color:var(--a);color:#000}
.sd.done{background:var(--ok);border-color:var(--ok);color:#000}
.sd.m2{border-color:#7c3aed55}
.sd.m2.active{background:var(--pur);border-color:var(--pur);color:#fff}
.sd.m2.done{background:var(--ok);border-color:var(--ok);color:#000}
.sline{width:7px;height:1px;background:var(--bd);flex-shrink:0}
/* SIDEBAR */
.sidebar{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.step-head{padding:8px 12px 7px;border-bottom:1px solid var(--bd);flex-shrink:0}
.stag{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--a)}
.stag.m2{color:#a78bfa}
.stitle{font-size:clamp(11px,1.5vw,14px);font-weight:700;margin-top:2px;line-height:1.3}
/* NEW FILE BANNERS */
.banner{padding:7px 10px;display:flex;gap:7px;align-items:flex-start;flex-shrink:0;font-size:10px;line-height:1.45;border-bottom:1px solid var(--bd)}
.banner.ide{background:#2a1f08;border-left:3px solid var(--amber);color:#fcd34d}
.banner.tc{background:#081f1f;border-left:3px solid var(--cyan);color:#67e8f9}
.banner b{display:block;margin-bottom:2px;font-size:10px}
/* LOOP */
.loop-wrap{width:100%;background:var(--s2);border-bottom:1px solid var(--bd);flex-shrink:0}
#loopCv{display:block;width:100%}
/* INSTRUCTIONS */
.instr{flex:1;overflow-y:auto;padding:7px 10px;display:flex;flex-direction:column;gap:4px}
.instr::-webkit-scrollbar{width:3px}
.instr::-webkit-scrollbar-thumb{background:var(--bd)}
.ic{display:flex;gap:7px;align-items:flex-start;padding:6px 9px;background:var(--s2);border:1px solid var(--bd);border-radius:7px;transition:border-color .2s}
.ic.lit{border-color:var(--ok)}
.ic.hl{border-color:var(--a)}
.inum{width:16px;height:16px;border-radius:50%;background:var(--a);color:#000;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s}
.inum.ok{background:var(--ok)}
.itxt{font-size:clamp(9px,1.1vw,11px);color:#c4c8db;line-height:1.45}
.itxt b{color:var(--a)}
.warn{display:flex;gap:6px;align-items:flex-start;padding:6px 8px;background:#1f1308;border:1px solid #78350f;border-radius:7px}
.warn p{font-size:10px;color:#fcd34d;line-height:1.4}
.info-chip{display:flex;gap:6px;align-items:flex-start;padding:6px 8px;background:#0f1f35;border:1px solid #1e4080;border-radius:7px}
.info-chip p{font-size:10px;color:#7dd3fc;line-height:1.4}
/* CODE REFERENCE PANEL — read-only */
.code-ref{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.code-ref::-webkit-scrollbar{width:3px}
.code-ref::-webkit-scrollbar-thumb{background:var(--bd)}
.cref-section{background:#090b12;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.cref-section h4{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.cref-code{font-family:monospace;font-size:10px;line-height:1.7;user-select:none;-webkit-user-select:none;white-space:pre}
/* Syntax colours — match editor */
.cc-kw{color:#c792ea}
.cc-fn{color:#82aaff}
.cc-num{color:#f78c6c}
.cc-str{color:#c3e88d}
.cc-cm{color:#546e7a;font-style:italic}
.cc-var{color:#e8e9ed}
.cc-type{color:#ffcb8b}
/* angle slider */
.angle-section{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.angle-section h4{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.angle-demo{display:flex;flex-direction:column;align-items:center;gap:5px}
.angle-demo input[type=range]{width:100%}
.angle-lbl{font-size:10px;color:var(--a);font-weight:700}
/* error card */
.err-card{background:#1a0a0a;border:1px solid #7f1d1d;border-radius:7px;padding:7px 9px;margin-top:4px}
.err-title{font-size:9px;font-weight:700;color:#fca5a5;margin-bottom:2px;font-family:monospace}
.err-body{font-size:9px;color:var(--mu);line-height:1.5}
.err-body b{color:#fcd34d}
/* SHELF + FOOTER */
.shelf{padding:6px 10px;border-top:1px solid var(--bd);flex-shrink:0}
.slbl{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.srow{display:flex;gap:4px;flex-wrap:wrap}
.stool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 5px;background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;font-size:8px;color:var(--mu);transition:border-color .15s;min-width:38px}
.stool:hover,.stool.sel{border-color:var(--a);color:var(--a)}
.sfooter{padding:6px 10px;border-top:1px solid var(--bd);flex-shrink:0;display:flex;gap:5px}
.bchk{flex:1;padding:7px;background:var(--a);color:#000;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer}
.bchk:hover{opacity:.88}
.bhint{padding:7px 9px;background:transparent;color:var(--mu);border:1px solid var(--bd);border-radius:7px;font-size:10px;cursor:pointer}
.bhint:hover{border-color:var(--a);color:var(--a)}
/* INFO STEPS */
.info-step{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.info-step::-webkit-scrollbar{width:3px}
.icard{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
.icard h3{font-size:11px;font-weight:700;margin-bottom:5px}
.icard p,.icard li{font-size:10px;color:var(--mu);line-height:1.6}
.icard ol{padding-left:14px}
.wire-legend{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.wl-row{display:flex;align-items:center;gap:7px}
.wl-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.wl-txt{font-size:10px;color:#c4c8db}
/* CANVAS AREA */
.carea{position:relative;overflow:hidden;background:#e8eaed;min-width:0}
#mc{position:absolute;top:0;left:0}
.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--bd);border-radius:9px;padding:8px 14px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:30;max-width:80%;text-align:center}
.toast.show{opacity:1}
.toast.warn{border-color:#78350f;color:#fcd34d;background:#1f1308}
.toast.ok{border-color:var(--ok);color:var(--ok);background:#0d2b1a}
.ntip{position:absolute;background:#1e2235f0;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:10px;pointer-events:none;opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap}
.ntip.show{opacity:1}
.zoom-bar{position:absolute;bottom:14px;right:14px;display:flex;gap:4px;z-index:25}
.zb{width:30px;height:30px;background:var(--s1);border:1px solid var(--bd);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mu);cursor:pointer;user-select:none}
.zb:hover{border-color:var(--a);color:var(--a)}
/* SPLIT PANEL (M2S3, M2S4) */
.split-panel{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.split-top{flex:1;position:relative;overflow:hidden;min-height:0}
.split-bottom{flex-shrink:0;height:clamp(160px,38%,280px);border-top:1px solid var(--bd);display:flex;flex-direction:column;background:#090b12}
.editor-header{padding:6px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--s1)}
.editor-title{font-size:10px;font-weight:700;color:var(--mu)}
.code-status{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600}
.code-status.ok{background:#0d2b1a;color:var(--ok);border:1px solid var(--ok)}
.code-status.err{background:#1a0808;color:#f87171;border:1px solid #7f1d1d}
.code-status.wait{background:var(--s2);color:var(--mu);border:1px solid var(--bd)}
.code-editor{flex:1;overflow:hidden;position:relative}
.code-editor textarea{width:100%;height:100%;background:#090b12;color:#e8e9ed;border:none;outline:none;resize:none;font-family:monospace;font-size:11px;line-height:1.65;padding:8px 10px;tab-size:2}
.code-error-msg{position:absolute;bottom:0;left:0;right:0;background:#1a0808;border-top:1px solid #7f1d1d;padding:5px 10px;font-size:10px;color:#fca5a5;display:none}
.code-error-msg.show{display:block}
/* dual-status pills */
.status-pills{display:flex;gap:6px;padding:7px 10px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--s1)}
.pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid var(--bd);color:var(--mu)}
.pill.done{background:#0d2b1a;color:var(--ok);border-color:var(--ok)}
.pill.active{background:#1a1308;color:var(--a);border-color:var(--a)}
/* DOOR STEP — info panel in right */
.door-panel{width:100%;height:100%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#090b12}
.door-panel::-webkit-scrollbar{width:4px}
.door-panel::-webkit-scrollbar-thumb{background:var(--bd)}
.door-section{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.door-section h2{font-size:13px;font-weight:700;color:#e8e9ed;margin-bottom:4px}
.door-section h3{font-size:11px;font-weight:700;color:var(--a);margin-bottom:3px;margin-top:8px}
.door-section h3:first-of-type{margin-top:0}
.door-section p,.door-section li{font-size:11px;color:var(--mu);line-height:1.65}
.door-section ol,.door-section ul{padding-left:16px;margin-top:3px}
.door-link{display:block;font-size:10px;color:#60a5fa;text-decoration:underline;margin:3px 0;word-break:break-all;cursor:pointer}
.door-link:hover{color:var(--a)}
.best-box{background:#0f1f35;border:1px solid #1e4080;border-radius:7px;padding:9px 12px;margin-top:4px}
.best-box p{font-size:10px;color:#7dd3fc;line-height:1.6}
.advice-box{background:#1f1308;border:1px solid #78350f;border-radius:7px;padding:9px 12px;margin-top:4px}
.advice-box p,.advice-box li{font-size:10px;color:#fcd34d;line-height:1.6}
.advice-box ul{padding-left:14px}
/* CERTIFICATE */
.cert-panel{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1e1b3a 0%,#090b12 70%)}
.cert-card{background:linear-gradient(135deg,#1e2235,#161927);border:2px solid var(--a);border-radius:16px;padding:32px 36px;text-align:center;max-width:420px;width:90%}
.cert-icon{font-size:48px;margin-bottom:10px}
.cert-title{font-size:20px;font-weight:700;color:var(--a);margin-bottom:4px}
.cert-sub{font-size:12px;color:var(--mu);margin-bottom:18px}
.cert-input{width:100%;padding:9px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:#e8e9ed;font-size:14px;text-align:center;outline:none;margin-bottom:12px}
.cert-input:focus{border-color:var(--a)}
.cert-btn{padding:10px 24px;background:var(--a);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px}
.cert-btn:hover{opacity:.88}
.cert-note{font-size:10px;color:var(--mu)}
/* SUCCESS OVERLAY */
.sov{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sov.show{opacity:1;pointer-events:auto}
.scard{background:var(--s1);border:1px solid var(--ok);border-radius:14px;width:min(600px,95vw);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;position:relative}
.scard::-webkit-scrollbar{width:3px}
.scard::-webkit-scrollbar-thumb{background:var(--bd)}
.sclose{position:absolute;top:10px;right:12px;background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer}
.sclose:hover{border-color:var(--pos);color:var(--pos)}
.scard-top{padding:16px 20px 12px;text-align:center;border-bottom:1px solid var(--bd)}
.sbadge{display:inline-flex;align-items:center;gap:5px;background:#0d2b1a;border:1px solid var(--ok);color:var(--ok);border-radius:20px;padding:3px 12px;font-size:10px;font-weight:700;margin-bottom:5px}
.stitle2{font-size:18px;font-weight:700;color:var(--ok);margin-bottom:3px}
.sbody{font-size:12px;color:var(--mu);line-height:1.6}
.sescape{font-size:10px;color:var(--a);background:#1f1308;border:1px solid rgba(245,166,35,.25);border-radius:7px;padding:7px 10px;margin-top:7px;line-height:1.5}
.tc-section{padding:10px 14px 0}
.tc-lbl{font-size:9px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.tc-canvas{width:100%;display:block;border-radius:8px;background:#1c1f2e}
.tc-note{font-size:9px;color:var(--mu);margin-top:5px;padding-bottom:10px}
.code-block{padding:8px 14px 10px}
.code-lbl{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.code-block pre{background:#090b12;border-radius:6px;padding:10px;font-size:9px;line-height:1.65;font-family:monospace;overflow-x:auto;user-select:none}
.snext{margin:0 14px 14px;padding:10px;background:var(--a);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:block;width:calc(100% - 28px)}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="logo">🔐 Escape Room Builder</div>
  <div class="mod-tabs">
    <div class="mod-tab" id="mt1" onclick="switchMod(1)">Module 1 — Lights 💡</div>
    <div class="mod-tab" id="mt2" onclick="switchMod(2)">Module 2 — Servo 🚪</div>
  </div>
  <div class="nav-arrows">
    <div class="nav-btn" id="btnPrev" onclick="navStep(-1)">&#8592;</div>
    <div class="nav-btn" id="btnNext" onclick="navStep(1)">&#8594;</div>
  </div>
  <div class="stepper" id="stepper"></div>
</header>
<aside class="sidebar" id="sidebar"></aside>
<div class="carea" id="carea">
  <canvas id="mc"></canvas>
  <div class="toast" id="toast"></div>
  <div class="ntip" id="ntip"></div>
  <div class="zoom-bar">
    <div class="zb" onclick="zoomBtn(1.25)">+</div>
    <div class="zb" onclick="zoomBtn(0.8)">−</div>
    <div class="zb" onclick="zoomReset()" style="font-size:11px">⌂</div>
  </div>
  <div class="sov" id="sov"><div class="scard" id="scard"></div></div>
</div>
</div>
<script>
// ═══════════════════════════════════════════════════
// CURRICULUM
// ═══════════════════════════════════════════════════
var STEPS = [
  // ── MODULE 1 ──
  {id:'m1s1',mod:1,ms:1,tag:'Module 1 · Step 1',title:'Simple LED circuit',type:'circuit',
   banner:{type:'tc',msg:'Open TinkerCad → Circuits → click <b>+ Create new Circuit</b>. Do not add to your previous circuit.'},
   escapeMsg:'This always-on LED tells players the puzzle is armed.',
   sTitle:'The LED is on!',sBody:'5V → Resistor → LED+ → LED– → GND. That\'s the complete loop.',
   hints:['Click the red 5V dot, then click the left resistor pin.','Click the right resistor pin, then click the LED+ dot (long leg).','Click the LED– dot (short leg), then click the blue GND dot.'],
   chk:'c1',bld:'b1',photos:true,
   code:'// No code needed for Step 1.\n// Arduino gives 5V power.\n// The resistor protects the LED.',
   ihtml:
    '<div class="ic hl"><div class="inum">1</div><div class="itxt">Select <b>Wire</b>. Click two <b>glowing dots</b> to connect them.</div></div>'+
    '<div class="warn"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 2L14 13H2Z" stroke="#f59e0b" stroke-width="1.5" fill="none"/></svg><p>LED: <b style="color:#fca5a5">long leg = +</b> · <b style="color:#93c5fd">short leg = –</b></p></div>'+
    '<div class="ic" id="ic2"><div class="inum" id="n2">2</div><div class="itxt"><span style="color:#ef4444">●</span> <b style="color:#fca5a5">5V</b> → Resistor</div></div>'+
    '<div class="ic" id="ic3"><div class="inum" id="n3">3</div><div class="itxt">Resistor → <b style="color:#fca5a5">LED + (long leg)</b></div></div>'+
    '<div class="ic" id="ic4"><div class="inum" id="n4">4</div><div class="itxt"><span style="color:#3b82f6">●</span> <b style="color:#93c5fd">LED – (short leg)</b> → <b style="color:#93c5fd">GND</b></div></div>'},

  {id:'m1s2',mod:1,ms:2,tag:'Module 1 · Step 2',title:'Add a pushbutton',type:'circuit',
   banner:{type:'ide',name:'LED_button',msg:'Beside your circuit, create a new sketch in Arduino IDE: <b>File → New</b>. Name it <b>LED_button</b>. Do not overwrite your last sketch.'},
   banner2:{type:'tc',msg:'Open TinkerCad → Circuits → click <b>+ Create new Circuit</b>. Do not add to your previous circuit.'},
   escapeMsg:'Players press the button to reveal a light clue.',
   sTitle:'Button controls the LED!',sBody:'INPUT_PULLUP: unpressed = HIGH, pressed = LOW.',
   hints:['Wire LED first: 5V → Resistor → LED+ → LED– → GND.','Connect Button A → Pin 2.','Connect Button B → GND.'],
   chk:'c2',bld:'b2',photos:true,
   code:'int buttonPin = 2;\nint ledPin = 13;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  pinMode(buttonPin, INPUT_PULLUP);\n}\n\nvoid loop() {\n  if (digitalRead(buttonPin) == LOW) {\n    digitalWrite(ledPin, HIGH);\n  } else {\n    digitalWrite(ledPin, LOW);\n  }\n}',
   ihtml:
    '<div class="ic hl"><div class="inum">1</div><div class="itxt">Wire the LED circuit first (same as Step 1).</div></div>'+
    '<div class="warn"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 2L14 13H2Z" stroke="#f59e0b" stroke-width="1.5" fill="none"/></svg><p>Button must straddle the <b style="color:#fcd34d">centre gap</b> of the breadboard.</p></div>'+
    '<div class="ic" id="ic2"><div class="inum" id="n2">2</div><div class="itxt"><span style="color:#ef4444">●</span> LED: <b style="color:#fca5a5">5V</b>→R→LED+→LED–→<b style="color:#93c5fd">GND</b></div></div>'+
    '<div class="ic" id="ic3"><div class="inum" id="n3">3</div><div class="itxt"><span style="color:#a78bfa">●</span> Button A → <b style="color:#a78bfa">Pin 2</b></div></div>'+
    '<div class="ic" id="ic4"><div class="inum" id="n4">4</div><div class="itxt"><span style="color:#3b82f6">●</span> Button B → <b style="color:#93c5fd">GND</b></div></div>'},

// STATE
// ═══════════════════════════════════════════════════
var DPR=window.devicePixelRatio||1;
var cur=0,stepDone=[];
var mc=document.getElementById('mc'),ctx=mc.getContext('2d'),ca=document.getElementById('carea');
var CW=0,CH=0,camX=0,camY=0,camZ=1;
var isPan=false,panS={x:0,y:0},camS={x:0,y:0};
var tool='wire',ws=null,wires=[],drag=null,doff={x:0,y:0};
var hovN=null,stepOK=false,hintI=0;
var comps={},crot={};
var blinkTmr=null,blinkOn=false,blinkIdx=0,blinkPh=true;
var loopRaf=null,loopT=0;
var servoAngle=0; // live angle from code editor
var codeOK=false,circuitOK=false;

function cl(a,v,b){return Math.max(a,Math.min(b,v));}
function s2w(sx,sy){return{x:(sx-camX)/camZ,y:(sy-camY)/camZ};}
function zAt(sx,sy,f){var w=s2w(sx,sy);camZ=cl(0.2,camZ*f,6);camX=sx-w.x*camZ;camY=sy-w.y*camZ;draw();}
function zoomBtn(f){zAt(CW/2,CH/2,f);}
function zoomReset(){camX=0;camY=0;camZ=1;draw();}

// ═══════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════
function switchMod(m){var idx=STEPS.findIndex(function(s){return s.mod===m;});if(idx>=0)goStep(idx);}
function navStep(d){var newIdx=cur+d;if(newIdx>=0&&newIdx<STEPS.length)goStep(newIdx);}

function goStep(idx){
  cur=idx;
  if(blinkTmr){clearTimeout(blinkTmr);blinkTmr=null;}
  wires=[];ws=null;stepOK=false;codeOK=false;circuitOK=false;hintI=0;blinkOn=false;
  camX=0;camY=0;camZ=1;hovN=null;drag=null;servoAngle=0;
  crot={arduino:0,resistor:0,led:0,button:0,servo:0};
  document.getElementById('sov').classList.remove('show');
  buildStepper();buildSidebar();resize();
  try{localStorage.setItem('ercb_cur',cur);}catch(e){}
}
function nextStep(){
  stepDone[cur]=true;
  try{localStorage.setItem('ercb_done',JSON.stringify(stepDone));}catch(e){}
  document.getElementById('sov').classList.remove('show');
  if(cur<STEPS.length-1)goStep(cur+1);
  else showToast('All steps complete!','ok');
}

// ═══════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════
function resize(){
  CW=ca.offsetWidth;CH=ca.offsetHeight;
  mc.width=CW*DPR;mc.height=CH*DPR;
  mc.style.width=CW+'px';mc.style.height=CH+'px';
  var step=STEPS[cur];
  if(step.type==='circuit'||step.type==='splitcode'||step.type==='splitfull'){
    placeComps();draw();
  } else {
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,CW,CH);
    drawInfoBg();
  }
}
window.addEventListener('resize',resize);

// ═══════════════════════════════════════════════════
// STEPPER & MODULE TABS
// ═══════════════════════════════════════════════════
function buildStepper(){
  var el=document.getElementById('stepper');el.innerHTML='';
  var mod=STEPS[cur].mod;
  document.getElementById('mt1').className='mod-tab'+(mod===1?' a1':'');
  document.getElementById('mt2').className='mod-tab'+(mod===2?' a2':'');
  document.getElementById('btnPrev').disabled=(cur===0);
  document.getElementById('btnNext').disabled=(cur===STEPS.length-1);
  STEPS.filter(function(s){return s.mod===mod;}).forEach(function(s,i){
    if(i>0){var ln=document.createElement('div');ln.className='sline';el.appendChild(ln);}
    var d=document.createElement('div'),gi=STEPS.indexOf(s);
    d.className='sd'+(s.mod===2?' m2':'')+(gi===cur?' active':stepDone[gi]?' done':'');
    d.textContent=s.ms;d.title=s.title;
    (function(ii){d.onclick=function(){goStep(ii);};})(gi);
    el.appendChild(d);
  });
}

    sb.innerHTML=head+bannerHTML+

      '<div class="instr" id="instrList">'+step.ihtml+'</div>'+

        '<div class="ic hl"><div class="inum">1</div><div class="itxt">Wire <b>LED + Button + Servo</b> in the top panel.</div></div>'+

        '<div class="ic" id="ic3"><div class="inum" id="n3">3</div><div class="itxt"><span style="color:#a78bfa">●</span> Button: <b style="color:#a78bfa">Pin 2</b>→Btn→<b style="color:#93c5fd">GND</b></div></div>'+
        '<div class="ic" id="ic4"><div class="inum" id="n4">4</div><div class="itxt"><span style="color:#f97316">●</span> Servo: Red→<b style="color:#fca5a5">5V</b>, Black→<b style="color:#93c5fd">GND</b>, Orange→<b style="color:#fdba74">Pin 10</b></div></div>'+
        '<div class="ic"><div class="inum" style="background:var(--pur)">5</div><div class="itxt">Write the code in the <b>bottom panel</b>.</div></div>'+
      '</div>'+
      '<div class="shelf"><div class="slbl">Tool</div><div class="srow">'+
      tBtn('wire','Wire')+tBtn('move','Move')+tBtn('pan','Pan')+tBtn('erase','Erase')+
      '</div></div>'+
      '<div class="status-pills" id="statusPills">'+
        '<div class="pill" id="pillCircuit">⬡ Circuit</div>'+
        '<div class="pill" id="pillCode">⬡ Code</div>'+
      '</div>';
    startLoop();

  } else if(step.type==='info'){
    sb.innerHTML=head+
      '<div class="loop-wrap"><canvas id="loopCv"></canvas></div>'+
      '<div class="info-step">'+buildInfoSidebar(step)+'</div>';

  } else if(step.type==='door'||step.type==='cert'){
    sb.innerHTML=head+
      '<div class="loop-wrap"><canvas id="loopCv"></canvas></div>'+
      '<div class="info-step"><div class="icard"><h3>What to do</h3><p>'+(step.type==='door'?'Read the options on the right. Choose one that suits your escape room design.':'Enter your name on the right to download your completion certificate.')+' </p></div>'+
      '<button class="bchk" style="margin:8px 0 0" onclick="nextStep()">'+(step.type==='door'?'I\'ve chosen my design →':'Finish')+' </button></div>';
    startLoop();

  }
  tool='wire';

function renderBlinkRef(){
  return sp('cc-cm','// 1. Set which pin your LED is on')+'\n'+
    sp('cc-kw','int')+' '+sp('cc-var','ledPin')+' = '+sp('cc-num','9')+sp('cc-var',';')+'\n\n'+
    sp('cc-cm','// 2. Setup runs once at the start')+'\n'+
    sp('cc-kw','void')+' '+sp('cc-fn','setup')+sp('cc-var','() {')+'\n'+
    '  '+sp('cc-fn','pinMode')+sp('cc-var','(ledPin, ')+sp('cc-val','OUTPUT')+sp('cc-var',');')+'\n'+
    sp('cc-var','}')+'\n\n'+
    sp('cc-cm','// 3. Loop runs forever')+'\n'+
    sp('cc-kw','void')+' '+sp('cc-fn','loop')+sp('cc-var','() {')+'\n'+
    '  '+sp('cc-fn','digitalWrite')+sp('cc-var','(ledPin, ')+sp('cc-val','HIGH')+sp('cc-var',');')+sp('cc-cm','  // LED on')+'\n'+
    '  '+sp('cc-fn','delay')+sp('cc-var','(')+sp('cc-num','500')+sp('cc-var',');')+sp('cc-cm','        // wait 0.5 sec')+'\n'+
    '  '+sp('cc-fn','digitalWrite')+sp('cc-var','(ledPin, ')+sp('cc-val','LOW')+sp('cc-var',');')+sp('cc-cm','   // LED off')+'\n'+
    '  '+sp('cc-fn','delay')+sp('cc-var','(')+sp('cc-num','500')+sp('cc-var',');')+sp('cc-cm','        // wait 0.5 sec')+'\n'+
    sp('cc-var','}')+'\n';
}

function sp(cls,txt){return '<span class="'+cls+'">'+txt+'</span>';}

function updateAngle(){
  var slide=document.getElementById('angSlide');if(!slide)return;
  var a=parseInt(slide.value)||0;
  var lbl=document.getElementById('angLbl');
  if(lbl)lbl.textContent=a+'° — '+(a<5?'door closed':a>85&&a<95?'door OPEN!':'turning...');
  // update code ref panels
  var cr=document.getElementById('crefLive');
  if(cr){cr.innerHTML=renderCodeRef(a);}
  var fr=cr&&cr.parentElement&&cr.parentElement.parentElement&&cr.parentElement.parentElement.querySelector('.cref-code:last-of-type');
  // re-render full code
  var all=document.querySelectorAll('.cref-code');
  if(all&&all.length>=2)all[all.length-1].innerHTML=renderFullServoCode(a);
  drawServoDemo(a);
  // also animate servo in circuit canvas
  servoAngle=a;
  if(STEPS[cur].type==='splitcode')draw();
}

function drawServoDemo(angle){
  var cv=document.getElementById('servoDem');if(!cv)return;

// ═══════════════════════════════════════════════════
// LIVE CODE PARSER
// ═══════════════════════════════════════════════════
function parseServoCode(code){
  var err=null;
  if(!(/\#include\s*<Servo\.h>/.test(code)))
    err='You need <b>#include &lt;Servo.h&gt;</b> at the very top — the Servo library is not loaded yet.';
  else if(!(/\.attach\s*\(/.test(code)))
    err='Call <b>myServo.attach(9)</b> inside setup() to connect the servo to a pin.';
  else{
    var pinMatch=code.match(/\.attach\s*\(\s*(\d+)\s*\)/);
    if(pinMatch){
      var pin=parseInt(pinMatch[1]);
      var pwmPins=[3,5,6,9,10,11];
      if(pwmPins.indexOf(pin)<0)
        err='Pin '+pin+' does not support PWM — use a ~ pin like 9, 10, or 11.';
    }
  }
  if(!err&&!(/\.write\s*\(/.test(code)))
    err='Call <b>myServo.write(90)</b> to tell the servo which angle to go to (0–180).';
  if(!err){
    var wm=code.match(/\.write\s*\(\s*(\d+)\s*\)/g);
    if(wm){
      for(var i=0;i<wm.length;i++){
        var v=parseInt(wm[i].match(/\d+/)[0]);
        if(v>180){err='Servo can only go 0–180°. Your value '+v+' is too high.';break;}
      }
    }
  }
  // Basic syntax checks
  if(!err){
    var lines=code.split('\n');
    for(var j=0;j<lines.length;j++){
      var ln=lines[j].trim();
      if(ln&&!ln.startsWith('//')&&!ln.startsWith('#')&&!ln.endsWith('{')&&!ln.endsWith('}')&&!ln.endsWith(';')&&ln.length>2&&!/^(void|int|bool|float|char|Servo)\s/.test(ln)&&!ln.endsWith(')')){
        err='Line '+(j+1)+': Missing <b>;</b> — every instruction needs a semicolon at the end.';break;
      }
    }
  }
  // Extract angle
  var angle=0;
  var wMatch=code.match(/\.write\s*\(\s*(\d+)\s*\)/);
  if(wMatch)angle=Math.min(180,parseInt(wMatch[1]));
  return{err:err,angle:angle};
}

function onCodeInput(){
  var code=document.getElementById('codeArea').value;
  var isBlink=STEPS[cur].id==='m1s4';
  var result=isBlink?parseBlinkCode(code):parseServoCode(code);
  var badge=document.getElementById('codeStatusBadge');
  var errEl=document.getElementById('codeErr');
  if(result.err){
    if(badge){badge.className='code-status err';badge.textContent='Fix the error';}
    if(errEl){errEl.innerHTML=result.err;errEl.classList.add('show');}
    codeOK=false;
  } else {
    if(badge){badge.className='code-status ok';badge.textContent='Code looks good!';}
    if(errEl)errEl.classList.remove('show');
    codeOK=true;
    if(!isBlink){servoAngle=result.angle;draw();}
    else{blinkOn=true;draw();}
  }
}

function parseBlinkCode(code){
  var err=null;
  if(!(/pinMode\s*\(/.test(code)))
    err='Add <b>pinMode(ledPin, OUTPUT)</b> in setup() — this tells Arduino the LED pin is an output.';
  else if(!(/digitalWrite\s*\(/.test(code)))
    err='Use <b>digitalWrite(ledPin, HIGH)</b> to turn the LED on and <b>digitalWrite(ledPin, LOW)</b> to turn it off.';
  else if(!(/delay\s*\(/.test(code)))
    err='Add <b>delay(500)</b> to pause between on and off — without it the LED blinks too fast to see.';
  else{
    var lines=code.split('\n');
    for(var j=0;j<lines.length;j++){
      var ln=lines[j].trim();
      if(ln&&!ln.startsWith('//')&&!ln.startsWith('#')&&!ln.endsWith('{')&&!ln.endsWith('}')&&!ln.endsWith(';')&&ln.length>2&&!/^(void|int|bool|float|char)\s/.test(ln)&&!ln.endsWith(')')){
        err='Line '+(j+1)+': Missing <b>;</b> — every instruction needs a semicolon at the end.';break;
      }
    }
  }
  return{err:err};
}

function onCodeInputFull(){
  var code=document.getElementById('codeArea').value;
  // Check for full escape room code essentials
  var hasInclude=/\#include\s*<Servo\.h>/.test(code);
  var hasAttach=/\.attach\s*\(/.test(code);
  var hasWrite=/\.write\s*\(\s*90\s*\)/.test(code);
  var hasDigitalRead=/digitalRead\s*\(/.test(code);
  var err=null;
  if(!hasInclude) err='Add <b>#include &lt;Servo.h&gt;</b> at the top.';
  else if(!hasAttach) err='Add <b>myServo.attach(10)</b> in setup() — tells Arduino which pin the servo uses.';
  else if(!hasDigitalRead) err='Use <b>digitalRead(buttonPin)</b> to check if the button is pressed.';
  else if(!hasWrite) err='Use <b>myServo.write(90)</b> to open the door (90 degrees).';
  var badge=document.getElementById('codeStatusBadge');
  var errEl=document.getElementById('codeErr');
  if(err){
    if(badge){badge.className='code-status err';badge.textContent='Fix the error';}
    if(errEl){errEl.innerHTML=err;errEl.classList.add('show');}
    codeOK=false;
  } else {
    if(badge){badge.className='code-status ok';badge.textContent='Code looks good!';}
    if(errEl)errEl.classList.remove('show');
    codeOK=true;
  }
  updateDualStatus();
  if(codeOK&&circuitOK)setTimeout(triggerOK,400);
}

function updateDualStatus(){
  var pc=document.getElementById('pillCircuit');
  var pk=document.getElementById('pillCode');
  if(pc){pc.className='pill'+(circuitOK?' done':' active');pc.textContent=circuitOK?'✓ Circuit':'⬡ Circuit';}
  if(pk){pk.className='pill'+(codeOK?' done':' active');pk.textContent=codeOK?'✓ Code':'⬡ Code';}
}

function placeComps(){
  var sc=Math.min(CW,CH)/560;
  var aw=cl(76,sc*104,136),ah=cl(124,sc*160,196);
  var lw=cl(20,sc*25,32),lL=cl(28,sc*40,52),lS=cl(13,sc*19,27),bH=cl(26,sc*36,46);
  var rw=cl(50,sc*68,84),rh=cl(14,sc*19,24);
  var btw=cl(18,sc*22,30),bth=cl(18,sc*22,30);
  var svw=cl(44,sc*56,74),svh=cl(30,sc*40,52);
  var cx=CW/2,cy=CH/2;
  if(!crot.arduino)crot={arduino:0,resistor:0,led:0,button:0,servo:0};
  comps={};
  var bld=STEPS[cur].bld;
  if(bld==='b1'||bld==='b2'||bld==='b3'||bld==='b8'){
    comps.arduino={t:'ard',x:cx-CW*.38,y:cy-ah/2,w:aw,h:ah};
    comps.resistor={t:'res',x:cx-rw/2,y:cy-ah*.40,w:rw,h:rh};
    comps.led={t:'led',x:cx+CW*.16,y:cy-(lL+bH)/2,w:lw,lL:lL,lS:lS,bH:bH};
  }
  if(bld==='b2'||bld==='b8')
    comps.button={t:'btn',x:cx+CW*.05,y:cy-bth/2,w:btw,h:bth};
  // M2S3 and M2S2: servo only (no LED/resistor/button)
  if(bld==='b5'){
    comps.arduino={t:'ard',x:cx-CW*.35,y:cy-ah/2,w:aw,h:ah};
    comps.servo={t:'srv',x:cx+CW*.1,y:cy-svh/2,w:svw,h:svh};
  }
  // M2S4: full combined
  if(bld==='b8'){

function wCol(a,b){if(a==='a5v'||b==='a5v'||a==='rA'||b==='rA'||a==='sR'||b==='sR')return'#ef4444';if(a==='agnd'||b==='agnd'||a==='lN'||b==='lN'||a==='sB'||b==='sB'||a==='bB'||b==='bB')return'#3b82f6';if(a==='p9'||b==='p9'||a==='sO'||b==='sO'||a==='p10'||b==='p10')return'#f97316';if(a==='p2'||b==='p2'||a==='bA'||b==='bA')return'#a78bfa';return'#f5a623';}

function segRect(x1,y1,x2,y2,rx,ry,rw,rh){var ps=[[rx,ry],[rx+rw,ry],[rx+rw,ry+rh],[rx,ry+rh]];for(var i=0;i<4;i++){var a=ps[i],b=ps[(i+1)%4];if(segSeg(x1,y1,x2,y2,a[0],a[1],b[0],b[1]))return true;}return x1>=rx&&x1<=rx+rw&&y1>=ry&&y1<=ry+rh;}

function pdist(px,py,x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;if(!l)return Math.hypot(px-x1,py-y1);var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}

function drawWires(ns){ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([]);wires.forEach(function(w){var na=ns[w.a],nb=ns[w.b];if(!na||!nb)return;var col=wCol(w.a,w.b);ctx.strokeStyle=col;ctx.lineWidth=2.5/camZ;var pts=route(na.x,na.y,nb.x,nb.y);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();var last=pts[pts.length-1],prev=pts[pts.length-2],s=6/camZ;var ang=Math.atan2(last[1]-prev[1],last[0]-prev[0]);ctx.save();ctx.translate(last[0],last[1]);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s*1.5,-s*.55);ctx.lineTo(-s*1.5,s*.55);ctx.closePath();ctx.fill();ctx.restore();});if(ws&&hovN&&ws!==hovN){var na=getNodes()[ws],nb=getNodes()[hovN];if(na&&nb){ctx.strokeStyle='rgba(245,166,35,.42)';ctx.lineWidth=2/camZ;ctx.setLineDash([6/camZ,4/camZ]);var mx=(na.x+nb.x)/2;ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(mx,na.y);ctx.lineTo(mx,nb.y);ctx.lineTo(nb.x,nb.y);ctx.stroke();ctx.setLineDash([]);}}}

function drawNodes(ns){var R=8/camZ;for(var k in ns){var n=ns[k],conn=wires.some(function(w){return w.a===k||w.b===k;}),hov=hovN===k,sel=ws===k;ctx.beginPath();ctx.arc(n.x,n.y,hov||sel?R*1.6:R,0,Math.PI*2);ctx.fillStyle=sel?'#f5a623':conn?n.col:'#12151f';ctx.fill();ctx.strokeStyle=conn?n.col:hov?'#f5a623':n.col+'88';ctx.lineWidth=1.5/camZ;ctx.stroke();if(!conn&&!sel){ctx.beginPath();ctx.arc(n.x,n.y,R+5/camZ,0,Math.PI*2);ctx.strokeStyle=n.col+'30';ctx.lineWidth=1/camZ;ctx.stroke();}}}

// ── HIT TESTING ───────────────────────────────────
function nodeAt(wx,wy){var ns=getNodes(),R=14/camZ;for(var k in ns){var n=ns[k];if(Math.hypot(wx-n.x,wy-n.y)<R)return k;}return null;}
function compAt(wx,wy){for(var k in comps){var c=comps[k],ch=c.t==='led'?(c.lL+c.bH+c.lS):c.h,cx=c.x+c.w/2,cy=c.y+ch/2,lp=rotPt({x:wx,y:wy},cx,cy,-(crot[k]||0));if(lp.x>=c.x&&lp.x<=c.x+c.w&&lp.y>=c.y&&lp.y<=c.y+ch)return k;}return null;}
function wireAt(wx,wy){var ns=getNodes(),th=10/camZ;for(var i=wires.length-1;i>=0;i--){var w=wires[i],na=ns[w.a],nb=ns[w.b];if(!na||!nb)continue;var pts=route(na.x,na.y,nb.x,nb.y);for(var j=0;j<pts.length-1;j++){if(pdist(wx,wy,pts[j][0],pts[j][1],pts[j+1][0],pts[j+1][1])<th)return i;}}return -1;}

// ── INPUT ─────────────────────────────────────────
function gp(e){var r=mc.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
mc.addEventListener('mousedown',onDn);mc.addEventListener('touchstart',function(e){e.preventDefault();onDn(e);},{passive:false});
mc.addEventListener('mousemove',onMv);mc.addEventListener('touchmove',function(e){e.preventDefault();onMv(e);},{passive:false});
mc.addEventListener('mouseup',onUp);mc.addEventListener('touchend',onUp);
mc.addEventListener('wheel',function(e){e.preventDefault();var s=gp(e);zAt(s.x,s.y,e.deltaY<0?1.1:0.91);},{passive:false});

function onDn(e){var s=gp(e),w=s2w(s.x,s.y),wx=w.x,wy=w.y;var step=STEPS[cur];if(step.type==='door'||step.type==='cert'||step.type==='info')return;if(tool==='pan'){isPan=true;panS=s;camS={x:camX,y:camY};mc.style.cursor='grabbing';return;}if(tool==='rotate'){var k=compAt(wx,wy);if(k){crot[k]=((crot[k]||0)+90)%360;draw();}return;}if(tool==='erase'){var i=wireAt(wx,wy);if(i>=0){wires.splice(i,1);stepOK=false;circuitOK=false;document.getElementById('sov').classList.remove('show');runChk();draw();}return;}if(tool==='move'){var ck=compAt(wx,wy);if(ck){drag=ck;doff={x:wx-comps[ck].x,y:wy-comps[ck].y};}return;}if(tool==='wire'){var n=nodeAt(wx,wy);if(n){if(!ws)ws=n;else{if(ws!==n){wires=wires.filter(function(w2){return!((w2.a===ws&&w2.b===n)||(w2.a===n&&w2.b===ws));});wires.push({a:ws,b:n});var ok=runChk();if(ok){if(step.type==='splitfull'){circuitOK=true;updateDualStatus();if(codeOK&&circuitOK)setTimeout(triggerOK,400);}else setTimeout(triggerOK,300);}}ws=null;}draw();return;}ws=null;draw();}}
function onMv(e){var s=gp(e),w=s2w(s.x,s.y),wx=w.x,wy=w.y;if(isPan){camX=camS.x+(s.x-panS.x);camY=camS.y+(s.y-panS.y);draw();return;}if(drag){comps[drag].x=wx-doff.x;comps[drag].y=wy-doff.y;draw();return;}var step=STEPS[cur];if(step.type==='door'||step.type==='cert'||step.type==='info')return;var n=nodeAt(wx,wy);if(n!==hovN){hovN=n;draw();}if(n){var nd=getNodes()[n];if(nd)showNtip(s.x,s.y,nd.lbl,nd.tip);}else hideNtip();if(tool==='rotate')mc.style.cursor=compAt(wx,wy)?'cell':'default';else if(tool==='move')mc.style.cursor=compAt(wx,wy)?'grab':'default';else mc.style.cursor=tool==='wire'?'crosshair':tool==='erase'?'not-allowed':tool==='pan'?'grab':'default';}
function onUp(){if(isPan){isPan=false;}drag=null;}

// ── CHECK LOGIC ───────────────────────────────────
function hw(a,b){return wires.some(function(w){return(w.a===a&&w.b===b)||(w.a===b&&w.b===a);});}
function tick(ic,nm,ok){var el=document.getElementById(ic),n=document.getElementById(nm);if(!el||!n)return;el.classList.toggle('lit',ok);n.textContent=ok?'✓':n.id[1];n.classList.toggle('ok',ok);}
function runChk(){
  var f={
    c1:function(){var r1=hw('a5v','rA'),r2=hw('rB','lP'),r3=hw('lN','agnd');tick('ic2','n2',r1);tick('ic3','n3',r2);tick('ic4','n4',r3);return r1&&r2&&r3;},
    c2:function(){var r1=hw('a5v','rA')&&hw('rB','lP')&&hw('lN','agnd'),r2=hw('bA','p2'),r3=hw('bB','agnd');tick('ic2','n2',r1);tick('ic3','n3',r2);tick('ic4','n4',r3);return r1&&r2&&r3;},
    c3:function(){var r1=hw('a5v','rA')&&hw('rB','lP')&&hw('lN','agnd'),r2=hw('p9','lP')||hw('p9','rB');tick('ic2','n2',r1);tick('ic3','n3',r2);return r1&&r2;},
    c5:function(){var r1=hw('a5v','sR'),r2=hw('agnd','sB'),r3=hw('p9','sO');tick('ic2','n2',r1);tick('ic3','n3',r2);tick('ic4','n4',r3);return r1&&r2&&r3;},
    c_code_blink:function(){return codeOK;},
    c_code3:function(){return codeOK;},
    c8:function(){var r1=hw('a5v','rA')&&hw('rB','lP')&&hw('lN','agnd'),r2=hw('bA','p2')&&hw('bB','agnd'),r3=hw('a5v','sR')&&hw('agnd','sB')&&hw('p10','sO');tick('ic2','n2',r1);tick('ic3','n3',r2);tick('ic4','n4',r3);return r1&&r2&&r3;}
  }[STEPS[cur].chk];
  return f?f():false;
}
function doCheck(){if(runChk())triggerOK();else showToast('Not complete — try a Hint','warn');}
function doHint(){var h=STEPS[cur].hints||[];showToast('💡 '+h[hintI%h.length],'');hintI++;}
function triggerOK(){if(stepOK)return;stepOK=true;if(STEPS[cur].id==='m1s3')startBlink();else draw();setTimeout(function(){buildSuccess();document.getElementById('sov').classList.add('show');},400);}

// ── BLINK ─────────────────────────────────────────
var blinkSeq=[200,200,200,200,200,200,400,600,200,600,200,600,200,400,200,200,200,200,200,200,1000];
function startBlink(){if(blinkTmr)clearTimeout(blinkTmr);blinkIdx=0;blinkPh=true;schedBlink();}
function schedBlink(){blinkOn=blinkPh;blinkPh=!blinkPh;blinkIdx++;draw();blinkTmr=setTimeout(schedBlink,blinkSeq[blinkIdx%blinkSeq.length]);}

// ── TOAST / NTIP ──────────────────────────────────
function showToast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast '+(t||'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},3500);}
function showNtip(sx,sy,l,h){var t=document.getElementById('ntip');t.innerHTML='<b style="color:var(--a)">'+l+'</b><br><span style="color:var(--mu)">'+h+'</span>';t.style.left=Math.min(sx+14,CW-175)+'px';t.style.top=Math.max(sy-44,4)+'px';t.classList.add('show');}
function hideNtip(){document.getElementById('ntip').classList.remove('show');}

// ═══════════════════════════════════════════════════
// SUCCESS CARD + TINKERCAD ILLUSTRATION
// ═══════════════════════════════════════════════════
function buildSuccess(){
  var step=STEPS[cur],sc=document.getElementById('scard');
  sc.style.borderColor=step.mod===2?'#7c3aed':'var(--ok)';
  var modSteps=STEPS.filter(function(s){return s.mod===step.mod;}).length;
  var nextLbl=cur<STEPS.length-1?'Continue: '+STEPS[cur+1].title+' →':'Finish';
  var html=
    '<button class="sclose" onclick="document.getElementById(\'sov\').classList.remove(\'show\')">✕ Keep building</button>'+
    '<div class="scard-top">'+
      '<div style="font-size:36px">'+(step.mod===2?'⚙️':'💡')+'</div>'+
      '<div class="sbadge">✓ Step '+step.ms+' of '+modSteps+' done</div>'+
      '<div class="stitle2">'+(step.sTitle||'Complete!')+'</div>'+
      '<div class="sbody">'+(step.sBody||'')+'</div>'+
      (step.escapeMsg?'<div class="sescape">🔐 '+step.escapeMsg+'</div>':'')+
    '</div>'+
    (step.photos?'<div class="tc-section"><div class="tc-lbl">Now recreate this in TinkerCad</div><canvas class="tc-canvas" id="tcCv"></canvas><div class="tc-note">Open TinkerCad → Circuits → New Circuit → wire it exactly as shown above.</div></div>':'')+
    (step.code?'<div class="code-block"><div class="code-lbl">Arduino code for this step — read and type it yourself</div><pre style="user-select:none;-webkit-user-select:none" oncontextmenu="return false">'+sHL(step.code)+'</pre></div>':'')+
    '<button class="snext" onclick="nextStep()">'+nextLbl+'</button>';
  sc.innerHTML=html;
  if(step.photos)setTimeout(function(){drawTC(cur);},60);
}

function sHL(c){return c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(\/\/[^\n]*)/g,'<span class="cc-cm">$1</span>').replace(/\b(void|int|bool|for|if|else|include)\b/g,'<span class="cc-kw">$1</span>').replace(/\b(HIGH|LOW|OUTPUT|INPUT_PULLUP|INPUT)\b/g,'<span class="cc-val">$1</span>').replace(/\b(setup|loop|pinMode|digitalWrite|digitalRead|delay|attach|write|read)\b/g,'<span class="cc-fn">$1</span>').replace(/"([^"]*)"/g,'<span class="cc-str">"$1"</span>').replace(/\b(\d+)\b/g,'<span class="cc-num">$1</span>');}

// TinkerCad illustration — accurate dark UI style
function drawTC(si){
  var cv=document.getElementById('tcCv');if(!cv)return;
  var pw=cv.parentElement.offsetWidth,ph=Math.round(pw*.68);
  cv.width=pw*DPR;cv.height=ph*DPR;cv.style.height=ph+'px';
  var c=cv.getContext('2d'),s=pw/320;
  c.setTransform(DPR,0,0,DPR,0,0);
  var W=pw,H=ph;
  function rP(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}
  // BG
  c.fillStyle='#1c1f2e';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,255,255,0.055)';c.lineWidth=.5;
  for(var gx=10;gx<W;gx+=18)for(var gy=10;gy<H;gy+=18){c.beginPath();c.arc(gx,gy,1,0,Math.PI*2);c.stroke();}
  // Top bar
  c.fillStyle='#0f111a';c.fillRect(0,0,W,13*s);
  c.fillStyle='#0accc5';c.font='bold '+(5.5*s)+'px system-ui';c.textAlign='left';c.fillText('TinkerCad \u2014 Circuits',5*s,9.5*s);
  // Right panel
  c.fillStyle='#13151f';c.fillRect(W-36*s,0,36*s,H);c.strokeStyle='#2a2f45';c.lineWidth=.5;c.beginPath();c.moveTo(W-36*s,0);c.lineTo(W-36*s,H);c.stroke();
  c.fillStyle='#0accc5';c.font='bold '+(4.5*s)+'px system-ui';c.textAlign='center';c.fillText('Components',W-18*s,14*s);
  ['Arduino Uno','Resistor','LED','Breadboard','Button','Servo'].forEach(function(t,i){c.fillStyle='#2a2f45';rP(W-33*s,18*s+i*11*s,30*s,9*s,2);c.fill();c.fillStyle='#6b7280';c.font=(4*s)+'px system-ui';c.textAlign='center';c.fillText(t,W-18*s,25*s+i*11*s);});
  // Arduino (dark navy — TinkerCad colour)
  var ax=6*s,ay=13*s,aw=56*s,ah=H-18*s;
  c.fillStyle='#1a2744';c.strokeStyle='#2a3a60';c.lineWidth=1.2;rP(ax,ay,aw,ah,4);c.fill();c.stroke();
  c.strokeStyle='rgba(80,120,255,0.1)';c.lineWidth=.4;for(var li=1;li<5;li++){c.beginPath();c.moveTo(ax,ay+ah*li/5);c.lineTo(ax+aw,ay+ah*li/5);c.stroke();}
  c.fillStyle='#1e3166';rP(ax+aw*.12,ay+ah*.3,aw*.7,ah*.22,2);c.fill();
  c.fillStyle='#6090ff';c.font='bold '+(4.5*s)+'px system-ui';c.textAlign='center';c.fillText('Arduino Uno',ax+aw/2,ay+ah*.42);
  c.fillStyle='#555';rP(ax+aw*.18,ay+ah*.88,aw*.5,ah*.1,2);c.fill();
  // Pin dots
  function pinDot(y,col){c.fillStyle=col;c.strokeStyle='#fff';c.lineWidth=.5;c.beginPath();c.arc(ax+aw,y,4*s,0,Math.PI*2);c.fill();c.stroke();}
  pinDot(ay+ah*.22,'#ef4444'); // 5V
  pinDot(ay+ah*.72,'#3b82f6'); // GND
  if(si===1||si===2||si===7)pinDot(ay+ah*.46,'#a78bfa'); // Pin 2
  if(si===2||si===4||si===5||si===7)pinDot(ay+ah*.35,'#f97316'); // Pin 9
  if(si===7)pinDot(ay+ah*.55,'#f97316'); // Pin 10
  // Breadboard (dark grey — TinkerCad style)
  var bx=72*s,by=13*s,bw=W-72*s-39*s,bh=H-18*s;
  c.fillStyle='#2c2e3e';c.strokeStyle='#3a3d50';c.lineWidth=1;rP(bx,by,bw,bh,4);c.fill();c.stroke();
  c.fillStyle='rgba(239,68,68,.28)';c.fillRect(bx+2,by+2,bw-4,bh*.1);
  c.fillStyle='rgba(59,130,246,.28)';c.fillRect(bx+2,by+bh*.89,bw-4,bh*.1);
  c.strokeStyle='#ef4444';c.lineWidth=.8;c.setLineDash([3,2]);c.beginPath();c.moveTo(bx+4,by+bh*.065);c.lineTo(bx+bw-4,by+bh*.065);c.stroke();
  c.strokeStyle='#3b82f6';c.beginPath();c.moveTo(bx+4,by+bh*.94);c.lineTo(bx+bw-4,by+bh*.94);c.stroke();c.setLineDash([]);
  c.fillStyle='#ef4444';c.font='bold '+(5*s)+'px system-ui';c.textAlign='left';c.fillText('+',bx+2,by+bh*.077);
  c.fillStyle='#3b82f6';c.fillText('\u2212',bx+2,by+bh*.965);
  c.fillStyle='rgba(0,0,0,.35)';

  for(var col2=0;col2<hcols;col2++)for(var row2=0;row2<4;row2++){c.beginPath();c.arc(bx+6*s+col2*hsx,by+bh*.57+row2*(bh*.3/3),1.6*s,0,Math.PI*2);c.fill();}
  c.fillStyle='#1e1f2e';c.fillRect(bx,by+bh*.5,bw,bh*.05);
  // Components on breadboard
  var rx=bx+bw*.06,ry=by+bh*.25,rw=bw*.36,rh=bh*.1;

  // Resistor
  if(si!==4&&si!==5){
    c.fillStyle='#d4a855';c.strokeStyle='#8a6030';c.lineWidth=.8;rP(rx,ry,rw,rh,2);c.fill();c.stroke();
    [{c:'#dc2626',x:.2},{c:'#dc2626',x:.32},{c:'#7c3a10',x:.44},{c:'#d4a017',x:.62}].forEach(function(b){c.fillStyle=b.c;c.fillRect(rx+rw*b.x,ry,rw*.1,rh);});
  }

  }
  // Button (steps 1,6)
  if(si===1||si===6){var btnx=bx+bw*.3,btny=by+bh*.36,bw2=bw*.14,bh2=bh*.14;c.fillStyle='#2a2a3a';c.strokeStyle='#3a3a5a';c.lineWidth=.8;rP(btnx,btny,bw2,bh2,3);c.fill();c.stroke();c.fillStyle='#cc3333';c.strokeStyle='#ff5555';rP(btnx+bw2*.15,btny+bh2*.15,bw2*.7,bh2*.7,3);c.fill();c.stroke();}

  if(si===4||si===5||si===6){var svx=si===6?bx+bw*.44:bx+bw*.1,svy=by+bh*.55,svww=bw*(si===6?.38:.55),svhh=bh*.3;c.fillStyle='#4a4a5a';c.strokeStyle='#6a6a7a';c.lineWidth=.8;rP(svx,svy,svww,svhh,4);c.fill();c.stroke();c.fillStyle='#333';rP(svx+svww*.1,svy+svhh*.15,svww*.8,svhh*.7,3);c.fill();c.fillStyle='#aaa';c.beginPath();c.arc(svx+svww*.5,svy+svhh*.5,svhh*.12,0,Math.PI*2);c.fill();c.strokeStyle='#f97316';c.lineWidth=2.5*s;c.lineCap='round';c.beginPath();c.moveTo(svx+svww*.5,svy+svhh*.5);c.lineTo(svx+svww*.5,svy-svhh*.18);c.stroke();}

  c.lineCap='round';c.setLineDash([]);
  if(si!==4&&si!==5){
    c.strokeStyle='#ef4444';c.lineWidth=4*s;c.beginPath();c.moveTo(ax+aw,ay+ah*.22);c.lineTo(rx,ry+rh/2);c.stroke();
    c.strokeStyle='#f97316';c.lineWidth=3.5*s;c.beginPath();c.moveTo(rx+rw,ry+rh/2);c.bezierCurveTo(rx+rw+5,ry-3,lx-bw*.026,lby+lbh*1.4,lx-bw*.026,lby+lbh*1.72);c.stroke();

    var svx2=si===6?bx+bw*.44:bx+bw*.1;
    c.strokeStyle='#ef4444';c.lineWidth=3.5*s;c.beginPath();c.moveTo(ax+aw,ay+ah*.22);c.lineTo(svx2+bw*(si===6?.19:.275),by+bh*.55);c.stroke();
    c.strokeStyle='#3b82f6';c.lineWidth=3.5*s;c.beginPath();c.moveTo(ax+aw,ay+ah*.72);c.lineTo(svx2+bw*(si===6?.19:.275),by+bh*.85);c.stroke();
    c.strokeStyle='#f97316';c.lineWidth=3*s;c.beginPath();c.moveTo(ax+aw,ay+ah*.35);c.lineTo(svx2+bw*(si===6?.19:.275),by+bh*.7);c.stroke();
  }
  // Callout numbers
  function clu(x,y,n,col){c.fillStyle=col+'44';c.strokeStyle=col+'99';c.lineWidth=.8;c.beginPath();c.arc(x,y,7*s,0,Math.PI*2);c.fill();c.stroke();c.fillStyle=col;c.font='bold '+(6*s)+'px system-ui';c.textAlign='center';c.fillText(n,x,y+2.5*s);}
  if(si!==4&&si!==5){clu((ax+aw+rx)/2,ay+ah*.13,'1','#ef4444');clu((rx+rw+lx)/2,ry-11*s,'2','#f97316');clu(lx+bw*.14,lby+lbh,'3','#3b82f6');}
  if(si===4||si===5){clu(ax+aw+8*s,ay+ah*.3,'1','#ef4444');clu(ax+aw+8*s,ay+ah*.65,'2','#3b82f6');clu(ax+aw+8*s,ay+ah*.47,'3','#f97316');}
}

// ═══════════════════════════════════════════════════
// INFO CANVAS
// ═══════════════════════════════════════════════════
function drawInfoBg(){
  ctx.fillStyle='#090b12';ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=1;
  for(var x=0;x<CW;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();}
  for(var y=0;y<CH;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}
  if(STEPS[cur].id==='m2s1')drawServoInfoCanvas();
}
function drawServoInfoCanvas(){
  var cx=CW/2,cy=CH/2,sc=Math.min(CW,CH)/500;
  rr(cx-55*sc,cy-35*sc,110*sc,70*sc,8);
  var sg=ctx.createLinearGradient(cx-55*sc,cy-35*sc,cx-55*sc,cy+35*sc);sg.addColorStop(0,'#6b7280');sg.addColorStop(1,'#374151');
  ctx.fillStyle=sg;ctx.strokeStyle='#1f2937';ctx.lineWidth=2;ctx.fill();ctx.stroke();
  ctx.fillStyle='#2e2e2e';ctx.strokeStyle='#555';ctx.lineWidth=1;rr(cx-38*sc,cy-20*sc,76*sc,40*sc,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#999';ctx.beginPath();ctx.arc(cx,cy,8*sc,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(245,166,35,.3)';ctx.lineWidth=4*sc;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-44*sc);ctx.stroke();
  ctx.strokeStyle='#f5a623';ctx.lineWidth=5*sc;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+44*sc,cy);ctx.stroke();
  ctx.fillStyle='#f5a623';ctx.beginPath();ctx.arc(cx+44*sc,cy,5*sc,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(245,166,35,.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cx,cy,26*sc,-Math.PI/2,0);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(245,166,35,.5)';ctx.font='bold '+cl(9,sc*12,15)+'px system-ui';ctx.textAlign='left';ctx.fillText('0° closed',cx+6*sc,cy-30*sc);
  ctx.fillStyle='#f5a623';ctx.fillText('90° open!',cx+46*sc,cy+4*sc);
  ctx.fillStyle='#e8e9ed';ctx.font='bold '+cl(13,sc*18,22)+'px system-ui';ctx.textAlign='center';ctx.fillText('Servo motor',cx,cy-52*sc);
  var wy=cy+64*sc;
  [['#ef4444','Red = 5V'],['#2a2a2a','Black/Brown = GND'],['#f97316','Orange = Signal']].forEach(function(w,i){
    ctx.fillStyle=w[0];ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx+(i-1)*85*sc,wy,10*sc,0,Math.PI*2);ctx.fill();if(i===1)ctx.stroke();
    ctx.fillStyle='#c4c8db';ctx.font=cl(9,sc*11,14)+'px system-ui';ctx.textAlign='center';ctx.fillText(w[1],cx+(i-1)*85*sc,wy+18*sc);
  });
}

// ═══════════════════════════════════════════════════
// LOOP ANIMATION
// ═══════════════════════════════════════════════════
function startLoop(){if(loopRaf)cancelAnimationFrame(loopRaf);loopFrame();}
function loopFrame(){
  var cv=document.getElementById('loopCv');if(!cv)return;
  var pw=cv.parentElement.offsetWidth,ph=Math.round(pw*.34);
  if(cv.width!==pw*DPR){cv.width=pw*DPR;cv.height=ph*DPR;cv.style.height=ph+'px';}
  var LW=pw,LH=ph,c=cv.getContext('2d');
  c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,LW,LH);
  var m=7,aw=22,x0=m+aw,y0=6,x1=LW-m,y1=LH-7;
  c.strokeStyle='#2a2f45';c.lineWidth=2;c.setLineDash([]);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y0);c.lineTo(x1,y1);c.lineTo(x0,y1);c.closePath();c.stroke();
  c.fillStyle='#1a7a35';c.strokeStyle='#22a040';c.lineWidth=.8;
  c.beginPath();c.moveTo(m+3,y0);c.lineTo(m+aw-3,y0);c.arcTo(m+aw,y0,m+aw,y0+3,3);c.lineTo(m+aw,y1-3);c.arcTo(m+aw,y1,m+aw-3,y1,3);c.lineTo(m+3,y1);c.arcTo(m,y1,m,y1-3,3);c.lineTo(m,y0+3);c.arcTo(m,y0,m+3,y0,3);c.closePath();c.fill();c.stroke();
  c.save();c.translate(m+aw/2,LH/2);c.rotate(-Math.PI/2);c.fillStyle='#6ee7b7';c.font='bold '+(Math.max(5,LW*.018))+'px system-ui';c.textAlign='center';c.fillText('Arduino',0,3);c.restore();
  c.fillStyle='#ef4444';c.font='bold '+(Math.max(5,LW*.02))+'px system-ui';c.textAlign='left';c.fillText('5V',x0+2,y0-1);
  c.fillStyle='#3b82f6';c.fillText('GND',x0+2,y1+8);
  // LED dome
  var lx=LW*.43,ly=y0+1,lh=LH-y0*2-2;
  c.strokeStyle='#c8c8c8';c.lineWidth=1;c.lineCap='round';c.beginPath();c.moveTo(lx-2.5,ly+lh*.35);c.lineTo(lx-2.5,ly+lh);c.stroke();c.beginPath();c.moveTo(lx+2.5,ly+lh*.5);c.lineTo(lx+2.5,ly+lh);c.stroke();
  c.fillStyle='#111';c.fillRect(lx-lh*.22,ly+lh*.52,lh*.44,lh*.22);
  var dg=c.createRadialGradient(lx-lh*.07,ly+lh*.25,lh*.02,lx,ly+lh*.32,lh*.22);dg.addColorStop(0,'rgba(255,180,180,.85)');dg.addColorStop(.4,'rgba(200,40,40,.8)');dg.addColorStop(1,'rgba(110,10,10,.82)');
  c.fillStyle=dg;c.strokeStyle='rgba(180,20,20,.7)';c.lineWidth=.8;c.beginPath();c.arc(lx,ly+lh*.32,lh*.22,Math.PI,0);c.closePath();c.fill();c.stroke();
  c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.arc(lx-lh*.07,ly+lh*.22,lh*.07,0,Math.PI*2);c.fill();
  c.fillStyle='#f87171';c.font=(Math.max(5,LW*.016))+'px system-ui';c.textAlign='center';c.fillText('LED',lx,ly+lh+7);
  // Resistor
  var rrx=x1-5,rry=LH/2-5;
  var rbg=c.createLinearGradient(rrx-11,rry,rrx-11,rry+10);rbg.addColorStop(0,'#f0e0a0');rbg.addColorStop(.5,'#f8eeb8');rbg.addColorStop(1,'#c8b870');
  c.fillStyle=rbg;c.strokeStyle='#a89848';c.lineWidth=.8;
  c.beginPath();c.moveTo(rrx-11+2,rry);c.lineTo(rrx+11-2,rry);c.arcTo(rrx+11,rry,rrx+11,rry+2,2);c.lineTo(rrx+11,rry+10-2);c.arcTo(rrx+11,rry+10,rrx+11-2,rry+10,2);c.lineTo(rrx-11+2,rry+10);c.arcTo(rrx-11,rry+10,rrx-11,rry+8,2);c.lineTo(rrx-11,rry+2);c.arcTo(rrx-11,rry,rrx-11+2,rry,2);c.closePath();c.fill();c.stroke();
  [['#dc2626',rrx-8],['#dc2626',rrx-3],['#7c3a10',rrx+2]].forEach(function(b){c.fillStyle=b[0];c.fillRect(b[1],rry,4,10);});
  c.fillStyle='#fcd34d';c.font=(Math.max(5,LW*.015))+'px system-ui';c.textAlign='center';c.fillText('R',rrx,rry+17);
  // Particle
  var perim=(x1-x0)*2+(y1-y0)*2,pos=(loopT%1)*perim;
  var segs=[[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]];
  var acc=0,px=x0,py=y0;
  for(var si=0;si<segs.length;si++){var sg=segs[si],l=Math.hypot(sg[2]-sg[0],sg[3]-sg[1]);if(pos<=acc+l){var rr2=(pos-acc)/l;px=sg[0]+(sg[2]-sg[0])*rr2;py=sg[1]+(sg[3]-sg[1])*rr2;break;}acc+=l;}
  var g=c.createRadialGradient(px,py,0,px,py,6);g.addColorStop(0,'#f5a623');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(px,py,6,0,Math.PI*2);c.fill();c.fillStyle='#f5a623';c.beginPath();c.arc(px,py,2,0,Math.PI*2);c.fill();
  loopT+=0.003;loopRaf=requestAnimationFrame(loopFrame);
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
// Patch resize to also build right panel
var _origResize=resize;
resize=function(){
  _origResize();
  var step=STEPS[cur];
  if(step.type==='splitcode'||step.type==='splitfull'||step.type==='door'||step.type==='cert'){
    // only build if not already present
    if(!document.getElementById('dynPanel'))buildRightPanel();
  }
};

// Patch goStep to rebuild right panel
var _origGoStep=goStep;
goStep=function(idx){
  // Remove dynamic panel before navigating
  var old=document.getElementById('dynPanel');if(old)old.remove();
  mc.style.display='block';
  if(mc.parentElement!==ca)ca.insertBefore(mc,ca.firstChild);
  _origGoStep(idx);
  var step=STEPS[idx];
  if(step.type==='splitcode'||step.type==='splitfull'||step.type==='door'||step.type==='cert'){
    buildRightPanel();
  }
};

try{
  var sd=localStorage.getItem('ercb_done');if(sd)stepDone=JSON.parse(sd);
  var sc3=parseInt(localStorage.getItem('ercb_cur')||'0');if(sc3>0&&sc3<STEPS.length)cur=sc3;
}catch(e){}
goStep(cur);
</script>
